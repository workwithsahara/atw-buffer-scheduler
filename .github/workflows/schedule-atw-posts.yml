name: Top up ATW Buffer queue

on:
  schedule:
    # Runs four times daily (04:00, 14:00, 18:00, 22:00 UTC). One run tops up every track
    # (ORIGINAL, DH, SKILLED, AM PM tracks) since they share the same channel.
    # Two runs a day give the queue a safety net if one run is skipped or late.
    - cron: "0 4,14,18,22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (log only, don't create posts)"
        type: boolean
        default: false
      remove_media_pattern:
        description: "Optional one-off: delete scheduled posts whose image URL contains this text (e.g. /media/WORKABROAD/)"
        type: string
        default: ""
      post_now_track:
        description: "Optional: publish this track's post for today right now (e.g. WORKABROAD). Leave empty for a normal run."
        type: string
        default: ""

jobs:
  schedule-posts:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run scheduler (all tracks)
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_ORG_ID: ${{ secrets.BUFFER_ORG_ID }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          GOOGLE_DRIVE_API_KEY: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          ATW_ORIGINAL_FOLDER_ID: ${{ secrets.ATW_ORIGINAL_FOLDER_ID }}
          ATW_DH_FOLDER_ID: ${{ secrets.ATW_DH_FOLDER_ID }}
          ATW_SKILLED_FOLDER_ID: ${{ secrets.ATW_SKILLED_FOLDER_ID }}
          REMOVE_MEDIA_PATTERN: ${{ github.event.inputs.remove_media_pattern }}
          POST_NOW_TRACK: ${{ github.event.inputs.post_now_track }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node schedule-atw-posts.js
